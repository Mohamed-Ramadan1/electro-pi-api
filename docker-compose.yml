services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: electro-pi-api
    restart: unless-stopped
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    networks:
      - electro-pi

  postgres:
    image: postgres:16-alpine
    container_name: electro-pi-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-electro_pi_dev}
      POSTGRES_USER: ${DATABASE_USER:-myuser}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-myuser} -d ${DATABASE_NAME:-electro_pi_dev}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - electro-pi

  redis:
    image: redis:7-alpine
    container_name: electro-pi-redis
    restart: unless-stopped
    ports:
      - '${REDIS_EXTERNAL_PORT:-6379}:6379'
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG || redis-cli ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - electro-pi

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  electro-pi:
    driver: bridge
